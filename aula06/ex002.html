<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body{
            background-color: rgb(113, 113, 192); /* Comentario em CSS */
            color: white;
            font: normal 20pt Arial;
        }
        h1{
            color: brown;
        }

    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição</p> <!--Comentario em HTML-->
    <script>
        var nome = window.prompt('Qual é o seu nome?') // Comentario em JS (pode ser /**/)
        window.alert('É um grande prazer em te conhecer, ' + nome + '!') /* Concatenação */
    </script>
</body>
</html>
